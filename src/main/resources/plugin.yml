name: VenturaCalendar
main: me.m0dii.venturacalendar.VenturaCalendar
description: VenturaCalendar by M0dii
version: ${version}
api-version: '26.2'
author: M0dii
softdepend: [PlaceholderAPI]
commands:
  venturacalendar:
    description: Base command
    permission: venturacalendar.command.venturacalendar
    usage: /<command>
    aliases: [venturacal, vc]
  calendar:
    description: Calendar command
    permission: venturacalendar.command.calendar
    usage: /<command>
    aliases: [cal]
permissions:
  venturacalendar.command.venturacalendar:
    description: Permission to use base command.
    default: op
  venturacalendar.command.changetime:
    description: Permission to add/subtract time, set starting year.
    default: op
  venturacalendar.command.help:
    description: Permission to view command help.
    default: op
  venturacalendar.command.reload:
    description: Permission to reload the plugin.
    default: op
  venturacalendar.command.events:
    description: Permission to create, list and remove calendar events.
    default: op
  venturacalendar.command.calendar:
    description: Permission to use the calendar command.
    default: op
  venturacalendar.command.calendar.realtime:
    description: Permission to open the real-time calendar.
    default: op
  venturacalendar.command.calendar.game:
    description: Permission to open the game-time calendar.
    default: op
  venturacalendar.command.fastforward:
    description: Permission to fast-forward or rewind time.
    default: op
